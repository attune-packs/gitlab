ref: gitlab.get_issue
label: "Get GitLab project issue"
description: "Retrieve one project issue by project-scoped IID"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: gitlab_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "pack.gitlab.credentials", key_ref: true, description: "Pack-owned GitLab credential Key ref"}
  project: {type: string, required: true, description: "Numeric project ID or path_with_namespace"}
  issue_iid: {type: integer, required: true, minimum: 1, description: "Project-scoped issue IID, not global ID"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [gitlab, issues, get]
