ref: gitlab.trigger_pipeline
label: "Create GitLab project pipeline"
description: "Create a pipeline on a branch or tag using the configured access token"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: gitlab_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "pack.gitlab.credentials", key_ref: true, description: "Pack-owned GitLab credential Key ref"}
  project: {type: string, required: true, description: "Numeric project ID or path_with_namespace"}
  ref: {type: string, required: true, description: "Branch or tag to run"}
  variables: {type: object, default: {}, description: "String CI/CD variable key-value pairs"}
  inputs: {type: object, description: "Typed CI/CD input values (GitLab 18.1+)"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [gitlab, pipelines, create]
