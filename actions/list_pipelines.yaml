ref: gitlab.list_pipelines
label: "List GitLab project pipelines"
description: "List project pipelines with filters and bounded pagination"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: gitlab_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "gitlab.credentials", key_ref: true, description: "Pack-owned GitLab credential Key ref"}
  project: {type: string, required: true, description: "Numeric project ID or path_with_namespace"}
  status: {type: string, enum: [created, waiting_for_resource, preparing, waiting_for_callback, pending, running, success, failed, canceling, canceled, skipped, manual, scheduled]}
  scope: {type: string, enum: [running, pending, finished, branches, tags]}
  ref: {type: string}
  sha: {type: string}
  source: {type: string}
  updated_after: {type: string, description: "ISO 8601 timestamp"}
  updated_before: {type: string, description: "ISO 8601 timestamp"}
  order_by: {type: string, enum: [id, status, ref, updated_at, user_id]}
  sort: {type: string, enum: [asc, desc]}
  per_page: {type: integer, default: 100, minimum: 1, maximum: 100}
  max_pages: {type: integer, default: 10, minimum: 1, maximum: 100}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [gitlab, pipelines, list]
