ref: gitlab.list_projects
label: "List GitLab projects"
description: "List projects visible to the credential with bounded pagination"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: gitlab_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "pack.gitlab.credentials", key_ref: true, description: "Pack-owned GitLab credential Key ref"}
  search: {type: string, description: "Search project paths and names"}
  visibility: {type: string, enum: [private, internal, public]}
  archived: {type: boolean}
  membership: {type: boolean}
  owned: {type: boolean}
  simple: {type: boolean}
  order_by: {type: string, enum: [id, name, path, created_at, updated_at, last_activity_at, similarity, star_count]}
  sort: {type: string, enum: [asc, desc]}
  per_page: {type: integer, default: 100, minimum: 1, maximum: 100}
  max_pages: {type: integer, default: 10, minimum: 1, maximum: 100}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [gitlab, projects, list]
