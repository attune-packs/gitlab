ref: gitlab
label: "GitLab"
description: "GitLab hosting API operations for projects, issues, merge requests, pipelines, and jobs"
version: "0.1.0"
author: "Attune"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://github.com/attune-packs/gitlab"
  repository_url: "https://github.com/attune-packs/gitlab"
  source_revision: "77b62e6db46d6ba8e0ccbcaddef9818cdffb257e"
  source_version: "1.0.1"
  license: "Apache-2.0"

tags: [gitlab, scm, hosting, ci-cd, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
